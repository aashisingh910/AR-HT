name: deploy-server
# main -> staging, tag v* -> production. The image is built from the repo root (it bundles the admin dashboard).
# Migrations run BEFORE traffic moves: render.yaml has `preDeployCommand: node scripts/migrate.mjs`
# (the server also migrates on start, so a skipped pre-deploy step is still safe).
on:
  push:
    branches: [main]
    tags: ['v*']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm ci
        working-directory: admin
      - run: npm run build
        working-directory: admin
      - run: npm ci
        working-directory: server
      - run: npm test
        working-directory: server
  image:
    needs: test
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-api
          tags: |
            type=sha
            type=ref,event=tag
            type=raw,value=staging,enable=${{ github.ref == 'refs/heads/main' }}
      - uses: docker/build-push-action@v6
        with: { context: ., file: server/Dockerfile, push: true, tags: '${{ steps.meta.outputs.tags }}', labels: '${{ steps.meta.outputs.labels }}' }
  staging:
    if: github.ref == 'refs/heads/main'
    needs: image
    runs-on: ubuntu-latest
    environment: staging
    steps:
      # A deploy hook from your host (Render: service -> Settings -> Deploy Hook). Add it as the secret DEPLOY_HOOK_URL in the "staging" environment.
      - run: curl -fsS -X POST "${{ secrets.DEPLOY_HOOK_URL }}"
  production:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: image
    runs-on: ubuntu-latest
    environment: production        # configure required reviewers on this environment for a manual approval gate
    steps:
      - run: curl -fsS -X POST "${{ secrets.DEPLOY_HOOK_URL }}"
