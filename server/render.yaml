# Render blueprint: one web service (uploads on a persistent disk) + a managed PostgreSQL database. Build context is the repo root.
databases:
  - name: hometown-ar-db
    plan: basic-256mb        # daily backups are included on paid plans; raise the plan as traffic grows
    databaseName: hometown_ar

services:
  - type: web
    name: hometown-ar-api
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: .
    plan: starter            # a persistent disk needs a paid instance
    healthCheckPath: /ready
    preDeployCommand: node scripts/migrate.mjs   # schema migrations before the new version takes traffic
    disk:
      name: data
      mountPath: /data
      sizeGB: 5
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: hometown-ar-db, property: connectionString }
      - key: JWT_SECRET
        generateValue: true
      - key: PUBLIC_URL
        sync: false          # set to https://<your service>.onrender.com after the first deploy
      - key: ANTHROPIC_API_KEY
        sync: false
