              type: number
            z:
              type: number
            baseY:
              type: number
          required:
            - x
            - z
            - baseY
      required:
        - ok
        - issues
        - warnings
    ValidateInput:
      type: object
      properties:
        key:
          type: string
        review:
          type: boolean
      required:
        - key
    RejectInput:
      type: object
      properties:
        reason:
          type: string
      required:
        - reason
    UploadLink:
      type: object
