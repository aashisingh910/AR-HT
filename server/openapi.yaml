      security:
        -
          bearer:
            []
      description: "Requires sign-in."
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
        default:
          description: "Error: { error: string, details?: string[] }"
