        default:
          description: "Error: { error: string, details?: string[] }"
  /v1/admin/rooms:
    get:
      summary: "Sample rooms (editor view)"
      tags:
        - admin
      security:
        -
          bearer:
            []
      description: "Requires sign-in and the editor role (admin also passes for editor routes)."
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Rooms"
        default:
          description: "Error: { error: string, details?: string[] }"
  /v1/admin/rooms/check:
    post:
      summary: "Run the integrity checks without saving"
      tags:
        - admin
      security:
        -
          bearer:
            []
      description: "Requires sign-in and the editor role (admin also passes for editor routes)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/Room"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/RoomCheck"
        default:
          description: "Error: { error: string, details?: string[] }"
  /v1/admin/rooms/{id}:
    put:
      summary: "Create or update a room; refused (422) when it fails the checks"
      tags:
        - admin
      security:
        -
          bearer:
            []
      description: "Requires sign-in and the editor role (admin also passes for editor routes)."
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/Room"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Room"
        default:
          description: "Error: { error: string, details?: string[] }"
    delete:
      summary: "Delete a room"
      tags:
        - admin
      security:
        -
          bearer:
            []
      description: "Requires sign-in and the editor role (admin also passes for editor routes)."
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
        default:
          description: "Error: { error: string, details?: string[] }"
  /v1/admin/stats:
    get:
