      tags:
        - auth
      security:
        []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/Credentials"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Session"
        default:
          description: "Error: { error: string, details?: string[] }"
  /v1/auth/logout:
    post:
      summary: "Revoke one refresh token"
      tags:
        - auth
      security:
        []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/RefreshInput"
      responses:
        "200":
          description: OK
        default:
          description: "Error: { error: string, details?: string[] }"
  /v1/auth/logout-all:
    post:
      summary: "Revoke every session of the signed-in user"
      tags:
        - auth
      security:
        -
          bearer:
            []
