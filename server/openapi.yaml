components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Credentials:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
        name:
          type: string
      required:
        - email
        - password
    RefreshInput:
      type: object
      properties:
        refreshToken:
          type: string
      required:
        - refreshToken
    CodeInput:
      type: object
      properties:
        code:
          type: string
          pattern: "^\\d{6}$"
      required:
        - code
    EmailInput:
      type: object
      properties:
        email:
          type: string
      required:
        - email
    ResetInput:
      type: object
      properties:
        email:
          type: string
        code:
          type: string
        password:
          type: string
      required:
        - email
        - code
        - password
    GoogleInput:
      type: object
      properties:
        idToken:
          type: string
      required:
        - idToken
    AppleInput:
      type: object
      properties:
        identityToken:
          type: string
        name:
          type: string
      required:
        - identityToken
    NameInput:
      type: object
      properties:
        name:
          type: string
      required:
        - name
    User:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        name:
          type: string
          nullable: true
        role:
          type: string
          enum:
            - user
            - editor
            - admin
        emailVerified:
          type: boolean
      required:
        - id
        - email
        - role
        - emailVerified
    UserEnvelope:
      type: object
      properties:
        user:
          "$ref": "#/components/schemas/User"
      required:
        - user
    Session:
      type: object
      properties:
        token:
          type: string
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer
        user:
          "$ref": "#/components/schemas/User"
      required:
        - accessToken
        - refreshToken
        - user
    WishItems:
      type: array
      items:
        type: object
        properties:
          id:
            type: string
          addedAt:
            type: integer
        required:
          - id
          - addedAt
    Dimensions:
      type: object
      properties:
        w:
          type: number
        d:
          type: number
        h:
          type: number
      required:
        - w
        - d
        - h
    Product:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        category:
          type: string
        role:
          type: string
        subcategory:
          type: string
        brand:
          type: string
        description:
          type: string
        images:
          type: array
          items:
            type: string
        dimensionsCm:
          "$ref": "#/components/schemas/Dimensions"
        dimsConfidence:
          type: string
          enum:
            - high
            - low
        sizeReview:
          type: string
        material:
          type: string
        colorFamily:
          type: string
        family:
          type: string
        collection:
          type: string
        retailerUrl:
          type: string
        modelStatus:
          type: string
        model3D:
          type: object
          properties:
            url:
              type: string
            key:
              type: string
            version:
              type: integer
            unit:
              type: string
          required:
            - url
            - key
            - version
            - unit
        proxy:
          type: object
          properties:
            template:
              type: string
            color:
              type: string
          required:
            - template
            - color
        roomTypes:
          type: array
          items:
            type: string
        ar:
          type: object
          properties:
            placements:
              type: array
              items:
                type: string
          required:
            - placements
      required:
        - id
        - name
        - category
        - dimensionsCm
    ProductPage:
      type: object
      properties:
        total:
          type: integer
        items:
          type: array
          items:
            "$ref": "#/components/schemas/Product"
      required:
        - total
        - items
    CatalogueDelta:
      type: object
      properties:
        version:
          type: integer
