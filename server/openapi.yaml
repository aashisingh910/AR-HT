        key:
          type: string
        version:
          type: integer
        method:
          type: string
        uploadUrl:
          type: string
        expiresInSec:
          type: integer
      required:
        - key
        - version
        - method
        - uploadUrl
        - expiresInSec
    ThumbnailInput:
