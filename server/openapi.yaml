                changed:
                  type: integer
                removed:
                  type: integer
                flagged:
                  type: integer
              required:
                - added
                - changed
                - removed
                - flagged
          required:
            - added
            - changed
            - removed
            - flagged
            - counts
      required:
        - id
        - products
        - skipped
        - issues
        - diff
    PublishInput:
