        default:
          description: "Error: { error: string, details?: string[] }"
  /v1/auth/google:
    post:
      summary: "Sign in with a Google ID token"
      tags:
        - auth
      security:
        []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/GoogleInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Session"
        default:
          description: "Error: { error: string, details?: string[] }"
  /v1/auth/login:
