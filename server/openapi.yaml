      tags:
        - admin
      security:
        -
          bearer:
            []
      description: "Requires sign-in and the editor role (admin also passes for editor routes)."
      parameters:
        -
          name: from
          in: query
          schema:
            type: string
        -
          name: to
          in: query
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Stats"
        default:
          description: "Error: { error: string, details?: string[] }"
  /v1/admin/users:
    get:
      summary: "Search users"
      tags:
        - admin
      security:
        -
          bearer:
            []
      description: "Requires sign-in and the admin role (admin also passes for editor routes)."
      parameters:
        -
          name: q
          in: query
          schema:
            type: string
      responses:
        "200":
          description: OK
        default:
          description: "Error: { error: string, details?: string[] }"
  /v1/admin/users/{id}:
    patch:
      summary: "Change role or disable/enable a user"
      tags:
        - admin
      security:
        -
          bearer:
            []
      description: "Requires sign-in and the admin role (admin also passes for editor routes)."
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/UserPatch"
      responses:
        "200":
          description: OK
        default:
          description: "Error: { error: string, details?: string[] }"
    delete:
      summary: "Delete a user and their data"
      tags:
        - admin
      security:
        -
          bearer:
            []
      description: "Requires sign-in and the admin role (admin also passes for editor routes)."
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
        default:
          description: "Error: { error: string, details?: string[] }"
