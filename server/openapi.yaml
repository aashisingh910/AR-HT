openapi: "3.0.3"
info:
  title: "HomeTown AR API"
  version: "1.0.0"
  description: "Generated by server/scripts/gen-openapi.mjs from the live route table. Every route is under /v1 unless it is a public page."
servers:
  -
    url: "http://localhost:4000"
paths:
  /.well-known/apple-app-site-association:
    get:
      summary: "iOS universal links file"
      tags:
        - public
      security:
        []
      responses:
        "200":
          description: OK
        default:
          description: "Error: { error: string, details?: string[] }"
  /.well-known/assetlinks.json:
    get:
      summary: "Android app links file"
      tags:
        - public
      security:
        []
      responses:
        "200":
          description: OK
        default:
          description: "Error: { error: string, details?: string[] }"
  /account/delete:
    get:
      summary: "Public page to delete an account (Play Store requirement)"
      tags:
        - public
      security:
        []
      responses:
        "200":
          description: OK
        default:
          description: "Error: { error: string, details?: string[] }"
  /d/{slug}:
    get:
      summary: "Public share page (HTML)"
      tags:
        - public
      security:
        []
      parameters:
        -
          name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
        default:
          description: "Error: { error: string, details?: string[] }"
  /health:
    get:
      summary: "Process is up"
      tags:
        - public
      security:
        []
      responses:
        "200":
          description: OK
        default:
          description: "Error: { error: string, details?: string[] }"
  /ready:
    get:
      summary: "Database answers"
      tags:
        - public
      security:
        []
      responses:
        "200":
          description: OK
        default:
          description: "Error: { error: string, details?: string[] }"
  /v1/admin/audit:
    get:
      summary: "Audit log of admin and editor writes"
      tags:
        - admin
      security:
        -
          bearer:
            []
      description: "Requires sign-in and the admin role (admin also passes for editor routes)."
      parameters:
        -
          name: limit
          in: query
          schema:
            type: string
      responses:
        "200":
          description: OK
        default:
          description: "Error: { error: string, details?: string[] }"
  /v1/admin/import:
    post:
      summary: "Upload the Shopify CSV; returns the diff (multipart \"file\")"
      tags:
        - admin
      security:
        -
          bearer:
            []
      description: "Requires sign-in and the editor role (admin also passes for editor routes)."
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              "$ref": "#/components/schemas/CsvForm"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ImportPreview"
        default:
          description: "Error: { error: string, details?: string[] }"
  /v1/admin/import/{id}/publish:
    post:
      summary: "Apply an import; removeMissing also removes products absent from the file"
      tags:
        - admin
      security:
        -
          bearer:
            []
      description: "Requires sign-in and the editor role (admin also passes for editor routes)."
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/PublishInput"
      responses:
        "200":
          description: OK
        default:
          description: "Error: { error: string, details?: string[] }"
  /v1/admin/models-queue:
    get:
      summary: "Needs model / awaiting review / rejected"
      tags:
        - admin
      security:
        -
          bearer:
            []
      description: "Requires sign-in and the editor role (admin also passes for editor routes)."
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ModelQueue"
        default:
          description: "Error: { error: string, details?: string[] }"
  /v1/admin/models/{productId}:
    get:
      summary: "Uploaded model versions"
      tags:
        - admin
      security:
        -
          bearer:
            []
      description: "Requires sign-in and the editor role (admin also passes for editor routes)."
      parameters:
        -
          name: productId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
        default:
          description: "Error: { error: string, details?: string[] }"
  /v1/admin/models/{productId}/upload-url:
    post:
      summary: "Signed PUT link for the next model version"
      tags:
        - admin
      security:
        -
          bearer:
            []
      description: "Requires sign-in and the editor role (admin also passes for editor routes)."
      parameters:
        -
          name: productId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UploadLink"
        default:
          description: "Error: { error: string, details?: string[] }"
  /v1/admin/models/{productId}/validate:
    post:
      summary: "Validate an uploaded GLB; review:true waits for approval"
      tags:
        - admin
      security:
        -
          bearer:
            []
      description: "Requires sign-in and the editor role (admin also passes for editor routes)."
      parameters:
        -
          name: productId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ValidateInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ProductResult"
        default:
          description: "Error: { error: string, details?: string[] }"
  /v1/admin/models/{productId}/{version}/approve:
    post:
      summary: "Publish a pending model"
      tags:
        - admin
      security:
        -
          bearer:
            []
      description: "Requires sign-in and the editor role (admin also passes for editor routes)."
      parameters:
        -
          name: productId
          in: path
          required: true
          schema:
            type: string
        -
          name: version
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ProductResult"
        default:
          description: "Error: { error: string, details?: string[] }"
  /v1/admin/models/{productId}/{version}/reject:
    post:
      summary: "Reject a pending model with a reason"
      tags:
        - admin
      security:
        -
          bearer:
            []
      description: "Requires sign-in and the editor role (admin also passes for editor routes)."
      parameters:
        -
          name: productId
          in: path
          required: true
          schema:
            type: string
        -
          name: version
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/RejectInput"
      responses:
        "200":
          description: OK
        default:
          description: "Error: { error: string, details?: string[] }"
  /v1/admin/products:
    post:
      summary: "Create a product, optionally with a GLB (multipart: product JSON + model)"
      tags:
        - admin
      security:
        -
          bearer:
            []
      description: "Requires sign-in and the editor role (admin also passes for editor routes)."
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              "$ref": "#/components/schemas/ProductForm"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ProductResult"
        default:
          description: "Error: { error: string, details?: string[] }"
  /v1/admin/products/{id}:
    put:
      summary: "Partial update; only fields sent are changed"
      tags:
        - admin
      security:
        -
          bearer:
            []
      description: "Requires sign-in and the editor role (admin also passes for editor routes)."
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              "$ref": "#/components/schemas/ProductForm"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ProductResult"
        default:
          description: "Error: { error: string, details?: string[] }"
    delete:
      summary: "Delete a product (apps learn through the catalogue delta)"
      tags:
        - admin
      security:
        -
          bearer:
            []
      description: "Requires sign-in and the editor role (admin also passes for editor routes)."
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
        default:
          description: "Error: { error: string, details?: string[] }"
  /v1/admin/products/{id}/size-checked:
    post:
      summary: "Mark a flagged size as checked (clears sizeReview)"
      tags:
        - admin
      security:
        -
          bearer:
            []
      description: "Requires sign-in and the editor role (admin also passes for editor routes)."
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
