          type: string
        products:
          type: integer
        skipped:
          type: integer
        issues:
          type: array
          items:
            type: object
            additionalProperties: true
        diff:
          type: object
          properties:
            added:
              type: array
              items:
                type: string
            changed:
              type: array
              items:
                type: string
            removed:
              type: array
              items:
                type: string
            flagged:
              type: array
              items:
                type: string
            counts:
              type: object
              properties:
                added:
